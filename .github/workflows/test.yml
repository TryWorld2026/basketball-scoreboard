name: Test

# 部署由 Cloudflare Workers Builds 负责（GitHub 侧不存任何凭据）。
# 这里只做一件事：把三张测试网当合并门禁跑一遍。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 三张网跑在内存假库上，不需要 Cloudflare 凭据
      - name: Smoke / attack probes / mutation gate
        run: npm test
